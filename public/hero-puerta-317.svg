<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
<title id="t">El Vago — La Habitación 317</title>
<desc id="d">Pasillo oscuro con una puerta marcada 317, documentos y fotografías de investigación.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050607"/><stop offset=".48" stop-color="#10100f"/><stop offset="1" stop-color="#190b0b"/></linearGradient>
 <linearGradient id="door" x2="1"><stop stop-color="#171718"/><stop offset=".55" stop-color="#282322"/><stop offset="1" stop-color="#090909"/></linearGradient>
 <linearGradient id="light" x2="1"><stop stop-color="#f1b36c" stop-opacity=".75"/><stop offset="1" stop-color="#f1b36c" stop-opacity="0"/></linearGradient>
 <radialGradient id="red"><stop stop-color="#e50914" stop-opacity=".25"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="26"/></filter>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<path d="M0 0H650L770 900H0Z" fill="#080909"/>
<path d="M1600 0H1010L880 900H1600Z" fill="#0b0b0b"/>
<path d="M0 900L690 530L910 530L1600 900Z" fill="#0a0a0a"/>
<path d="M0 0H1600V900H0Z" fill="url(#red)" opacity=".32"/>
