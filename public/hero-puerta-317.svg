 <path d="M205 280L425 270M425 215L315 325M280 440L350 380M205 555L315 450" stroke="#b8b8b8" stroke-width="2" opacity=".42"/>
 <circle cx="205" cy="195" r="42" fill="#242424"/><circle cx="205" cy="195" r="30" fill="#111"/>
 <circle cx="445" cy="147" r="31" fill="#242424"/><circle cx="445" cy="147" r="22" fill="#111"/>
</g>
<g font-family="Arial" fill="#d9d9d9" opacity=".75">
 <text x="110" y="105" font-size="18" letter-spacing="5">EXPEDIENTE / 001</text>
 <text x="112" y="600" font-size="16" letter-spacing="4">OBSERVA · ANALIZA · DESCUBRE</text>
</g>
<!-- doorway -->
<path d="M790 0H1370V900H790Z" fill="#111"/>
<path d="M830 0H1330V900H830Z" fill="#1a1715"/>
<path d="M875 0H1290V900H875Z" fill="url(#door)" stroke="#51463e" stroke-width="7"/>
<path d="M910 55H1255V840H910Z" fill="none" stroke="#0a0a0a" stroke-width="30"/>
<path d="M945 110H1220V790H945Z" fill="none" stroke="#4a403a" stroke-width="4"/>
<path d="M945 455H1220" stroke="#4a403a" stroke-width="4"/>
<rect x="1090" y="355" width="105" height="88" rx="5" fill="#171514" stroke="#6a5849"/>
<text x="1142" y="418" text-anchor="middle" font-family="Georgia,serif" font-size="58" fill="#d4a36a">317</text>
<circle cx="1200" cy="560" r="9" fill="#c9a16c"/><rect x="1194" y="568" width="24" height="7" rx="3" fill="#777"/>
