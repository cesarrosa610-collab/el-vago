<g opacity=".72">
 <rect x="90" y="125" width="230" height="155" fill="#161616" stroke="#454545"/>
 <rect x="350" y="80" width="190" height="135" fill="#121212" stroke="#3c3c3c"/>
 <rect x="110" y="325" width="170" height="230" fill="#121212" stroke="#383838"/>
