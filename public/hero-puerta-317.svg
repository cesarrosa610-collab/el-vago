<path d="M0 720H1600" stroke="#e50914" stroke-width="2" opacity=".28"/>
<text x="65" y="760" font-family="Arial" font-size="15" font-weight="700" letter-spacing="7" fill="#e50914">ALGUNAS PUERTAS NUNCA DEBERÍAN ABRIRSE</text>
<text x="65" y="800" font-family="Arial" font-size="13" letter-spacing="4" fill="#aaa">LA HABITACIÓN 317 · INVESTIGACIÓN ABIERTA</text>
<rect width="1600" height="900" fill="url(#red)" opacity=".08"/>
</svg>