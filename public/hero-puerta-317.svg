<path d="M760 0H870L920 900H700Z" fill="url(#light)" opacity=".38"/>
<path d="M820 0H880L940 900H820Z" fill="#f2b56f" opacity=".07" filter="url(#blur)"/>
<!-- desk/evidence -->
<g opacity=".92">
 <path d="M1160 730L1500 660L1600 700V900H1120Z" fill="#111"/>
 <rect x="1280" y="670" width="210" height="130" rx="4" transform="rotate(-8 1280 670)" fill="#d1c4aa"/>
