<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 520" role="img" aria-labelledby="t d">
<title id="t">Pasillo de la comunidad</title>
<desc id="d">Pasillo oscuro con iluminación roja, silueta al fondo y muro documental de fotografías.</desc>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#08090a"/><stop offset=".58" stop-color="#171111"/><stop offset="1" stop-color="#2a090c"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#171313"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <radialGradient id="red" cx=".82" cy=".45" r=".6"><stop stop-color="#e50914" stop-opacity=".48"/><stop offset=".42" stop-color="#9e0a12" stop-opacity=".16"/><stop offset="1" stop-color="#e50914" stop-opacity="0"/></radialGradient>
  <radialGradient id="warm" cx=".5" cy=".25" r=".5"><stop stop-color="#e2a05e" stop-opacity=".3"/><stop offset="1" stop-color="#e2a05e" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect width="1400" height="520" fill="url(#wall)"/>
<rect width="1400" height="520" fill="url(#red)"/>
<path d="M0 355L530 250L870 250L1400 355V520H0Z" fill="url(#floor)"/>
<path d="M0 355L530 250M1400 355L870 250" stroke="#5b2528" stroke-width="3" opacity=".55"/>
<ellipse cx="1040" cy="170" rx="220" ry="110" fill="#e50914" opacity=".16" filter="url(#blur)"/>
<ellipse cx="650" cy="70" rx="110" ry="60" fill="#f1b36b" opacity=".12" filter="url(#blur)"/>
<!-- documentary wall -->
<g opacity=".92">
  <rect x="78" y="72" width="360" height="210" fill="#111" stroke="#3e3533" stroke-width="4"/>
  <rect x="110" y="100" width="92" height="70" fill="#413b37"/>
  <rect x="220" y="92" width="168" height="88" fill="#292525"/>
  <rect x="112" y="190" width="130" height="62" fill="#2d2928"/>
  <rect x="260" y="194" width="120" height="60" fill="#463a35"/>
  <path d="M200 136L260 136M242 225L260 225" stroke="#e50914" stroke-width="3" opacity=".55"/>
</g>
<!-- corridor -->
<path d="M515 70L700 38L880 70L870 330L530 330Z" fill="#0d0d0e" opacity=".9"/>
<path d="M585 105L700 82L815 105L805 290L595 290Z" fill="#181617"/>
<rect x="665" y="112" width="72" height="178" rx="4" fill="#090909"/>
<rect x="684" y="130" width="34" height="8" fill="#b88958" opacity=".6"/>
<!-- silhouette -->
<circle cx="700" cy="275" r="22" fill="#030303"/>
<path d="M670 330Q675 285 700 285T730 330Z" fill="#030303"/>
<!-- red-lit wall -->
<path d="M880 72L1320 112V330L870 330Z" fill="#190a0c"/>
<g opacity=".8">
  <rect x="930" y="110" width="115" height="78" fill="#2b2424" stroke="#5a3b3d"/>
  <rect x="1070" y="128" width="160" height="96" fill="#302727" stroke="#694145"/>
  <rect x="955" y="215" width="180" height="85" fill="#241f20" stroke="#56383a"/>
  <rect x="1160" y="245" width="115" height="62" fill="#3a2c2d" stroke="#744247"/>
</g>
<path d="M930 210L1070 176M1040 265L1160 276" stroke="#e50914" stroke-width="3" opacity=".5"/>
<text x="82" y="456" fill="#fff" font-family="Arial" font-size="30" font-weight="700" letter-spacing="2">CADA PISTA ABRE UNA PREGUNTA</text>
<text x="84" y="486" fill="#e50914" font-family="Arial" font-size="11" font-weight="700" letter-spacing="5">COMUNIDAD / TEORÍAS / EVIDENCIAS</text>
</svg>